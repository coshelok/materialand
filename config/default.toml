kind = "medium"  # Font face: "regular", "medium", "bold" or "icon".

# Palette chip captions.
[typography.label_small]
size = 11.0  # Font size in logical pixels.
line_height = 16.0  # Text line box height in logical pixels; must be at least size.
tracking = 0.5  # Extra letter spacing in logical pixels; negative values tighten text.
kind = "medium"  # Font face: "regular", "medium", "bold" or "icon".

# Large body text and empty launcher message.
[typography.body_large]
size = 16.0  # Font size in logical pixels.
line_height = 24.0  # Text line box height in logical pixels; must be at least size.
tracking = 0.5  # Extra letter spacing in logical pixels; negative values tighten text.
kind = "regular"  # Font face: "regular", "medium", "bold" or "icon".

# App captions, date text and regular body text.
[typography.body_medium]
size = 14.0  # Font size in logical pixels.
