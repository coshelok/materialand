kind = "regular"  # Font face: "regular", "medium", "bold" or "icon".

# Focused window title.
[typography.focused_title]
size = 14.0  # Font size in logical pixels.
line_height = 20.0  # Text line box height in logical pixels; must be at least size.
tracking = 0.1  # Extra letter spacing in logical pixels; negative values tighten text.
kind = "bold"  # Font face: "regular", "medium", "bold" or "icon".

# Optional light-mode Material role overrides, e.g. primary = "#aabbcc"; omitted roles use the generated palette.
[colors.light]

# Optional dark-mode Material role overrides; opaque #RRGGBB colors, with the same role names as light mode.
[colors.dark]

# App context menu for home shortcuts and dock pins; dimensions are logical pixels.
[app_menu]
width = 260.0  # Menu width.
height = 160.0  # Menu height.
margin = 12.0  # Minimum screen-edge margin when placing the menu.
row_inset = 8.0  # Horizontal inset of action rows.
row_y = 44.0  # Dock pin/unpin row top position.
home_row_y = 100.0  # Home shortcut add/remove row top position.
row_height = 48.0  # Action row height.
title_x = 16.0  # App name X within the menu.
title_y = 14.0  # App name top position within the menu.
icon_x = 30.0  # Action icon center X within the menu.
icon_size = 22.0  # Action glyph size.
label_x = 52.0  # Action label X within the menu.
label_y = 14.0  # Action label top offset inside its row.

# Font discovery; bundled and system fonts remain available as fallbacks.
[fonts]
directory = ""  # Optional font search directory; "" uses automatic discovery.

# Touchpad finger scrolling in applications and the launcher; mouse-wheel direction is independent.
[input.touchpad]
invert_scroll = false  # true reverses both scroll axes; false keeps the original direction. Three-finger gestures are unchanged.
